<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbearia Premium</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-principal: #121212;
      --bg-card: #1A1A1A;
      --bg-input: #262626;
      --dourado: #D4AF37;
      --dourado-hover: #AA8B22;
      --texto-claro: #F5F5F5;
      --texto-mutado: #A3A3A3;
      --borda: #333333;
      --verde-wsp: #25D366;
      --serif: ui-serif, Georgia, "Times New Roman", serif;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    #bb-root {
      min-height: 100vh;
      color: var(--texto-claro);
      font-family: var(--sans);
      background-color: var(--bg-principal);
      background-image: radial-gradient(circle at 50% 0%, #222222 0%, var(--bg-principal) 70%);
    }

    .bb-top {
      background: #0A0A0A;
      border-bottom: 1px solid var(--borda);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .bb-badge-name { font-family: var(--serif); font-size: 24px; color: var(--dourado); font-weight: 700; letter-spacing: 1px; }
    .bb-badge-sub { font-size: 10px; letter-spacing: 4px; color: var(--texto-mutado); text-transform: uppercase; margin-top: 2px; }

    .bb-who { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .bb-who select { background: var(--bg-input); color: var(--texto-claro); border: 1px solid var(--borda); border-radius: 6px; padding: 8px 12px; }

    .bb-tabs { background: #0F0F0F; border-bottom: 1px solid var(--borda); padding: 0 30px; display: flex; gap: 10px; overflow-x: auto; }
    .bb-tab { padding: 16px 20px; font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--texto-mutado); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: 0.3s; }
    .bb-tab.active, .bb-tab:hover { color: var(--dourado); border-bottom-color: var(--dourado); }

    .bb-body { padding: 30px; max-width: 1100px; margin: 0 auto; }
    .bb-hero { text-align: center; margin-bottom: 30px; }
    .bb-hero h1 { font-family: var(--serif); font-size: 32px; color: var(--dourado); margin-bottom: 5px; }

    .bb-panel { background: var(--bg-card); border: 1px solid var(--borda); border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .bb-panel h2 { font-family: var(--serif); color: var(--dourado); margin-bottom: 20px; font-size: 20px; border-bottom: 1px solid var(--borda); padding-bottom: 10px; }

    .bb-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .bb-field { display: flex; flex-direction: column; gap: 6px; }
    .bb-field label { font-size: 12px; font-weight: 600; color: var(--texto-mutado); text-transform: uppercase; }
    .bb-field input, .bb-field select { background: var(--bg-input); color: var(--texto-claro); border: 1px solid var(--borda); border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
    .bb-field input:focus, .bb-field select:focus { border-color: var(--dourado); }

    .bb-btn { border: none; border-radius: 8px; padding: 12px 22px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; text-transform: uppercase; }
    .bb-btn.primary { background: var(--dourado); color: #000; }
    .bb-btn.primary:hover { background: var(--dourado-hover); }
    .bb-btn.wsp { background: var(--verde-wsp); color: #FFF; margin-top: 10px; }

    .bb-grid-wrap { overflow-x: auto; border: 1px solid var(--borda); border-radius: 8px; }
    table.bb-grid { border-collapse: collapse; width: 100%; font-size: 13px; text-align: left; }
    table.bb-grid th { background: #0A0A0A; color: var(--dourado); padding: 14px; border-bottom: 1px solid var(--borda); }
    table.bb-grid td { padding: 12px 14px; border-bottom: 1px solid var(--borda); color: var(--texto-claro); }

    .bb-cortes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .bb-corte-card { background: var(--bg-card); border: 1px solid var(--borda); border-radius: 12px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
    .bb-corte-card::before { content: ""; position: absolute; top:0; left:0; width: 100%; height: 3px; background: var(--dourado); }
    .bb-corte-card h3 { font-family: var(--serif); color: var(--texto-claro); font-size: 18px; margin-bottom: 8px; }
    .bb-corte-card p { font-size: 12px; color: var(--texto-mutado); margin-bottom: 15px; }
    .bb-corte-card .preco { font-size: 18px; font-weight: 700; color: var(--dourado); }
  </style>
</head>
<body>
  <div id="bb-root">
    <div class="bb-top">
      <div id="bb-logo"></div>
      <div class="bb-who" id="bb-who"></div>
    </div>
    <div class="bb-tabs" id="bb-tabs"></div>
    <div class="bb-body" id="bb-body">Carregando dados...</div>
  </div>

  <script>
  (function(){
    "use strict";

    // Conexão Supabase com suas credenciais reais
    const SUPABASE_URL = "https://lgdngncxmlbtshclanzx.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZG5nbmNubWxidHNoY2xhbnp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMTIwNzgsImV4cCI6MjEwMjc4ODA3OH0.FSmfOpRQqeaEeRoGK1kQ-lRIyeG-DK6wp68wzB0mjcY"; 
    
    const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const body = document.getElementById('bb-body');
    const logoBox = document.getElementById('bb-logo');
    const whoBox = document.getElementById('bb-who');
    const tabsBox = document.getElementById('bb-tabs');

    let config = { nomeLoja: 'Danilo Barber Shop', whatsappAdmin: '5561999999999' };
    
    let barbeiros = [
      { id:'1', nome:'DANILO', telefone_whatsapp:'5561999999999', porcentagem_comissao:50, ativo:true },
      { id:'2', nome:'MAXSUELL', telefone_whatsapp:'5561977777777', porcentagem_comissao:50, ativo:true },
      { id:'3', nome:'DIEGO', telefone_whatsapp:'5561988888888', porcentagem_comissao:50, ativo:true }
    ];

    let cortes = [
      { id:'1', nome:'Taper Fade', desc:'Transição suave nas têmporas e nuca.', preco:40 },
      { id:'2', nome:'Degradê (Low/Mid/High)', desc:'Degradê clássico em várias alturas.', preco:40 },
      { id:'3', nome:'Americano', desc:'Laterais leves e topo texturizado.', preco:40 },
      { id:'4', nome:'Modern Mullet', desc:'Lateral raspada e nuca alongada.', preco:45 },
      { id:'5', nome:'Buzz Cut', desc:'Raspado uniforme com contorno alinhado.', preco:35 },
      { id:'6', nome:'Corte na Tesoura', desc:'Acabamento 100% manual na tesoura.', preco:50 }
    ];

    let agendamentos = [];
    let roleMode = localStorage.getItem('barb-role') || null;
    let activeTab = 'agendar';
    let selectedDate = new Date().toISOString().slice(0,10);

    function isAdmin(){ return roleMode === 'gestor'; }
    function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function gerarSlots(){
      const slots = [];
      let cur = 9*60; const fim = 19*60;
      while(cur < fim){
        const hh = Math.floor(cur/60), mm = cur%60;
        slots.push(`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`);
        cur += 30;
      }
      return slots;
    }

    async function carregarAgendamentosSupabase(){
      try {
        const { data, error } = await sbClient.from('se_agendamentos').select('*');
        if(!error && data){ agendamentos = data; }
      } catch(e){
        console.error("Erro ao buscar Supabase:", e);
      }
    }

    function renderLogo(){
      logoBox.innerHTML = `<div><div class="bb-badge-name">${esc(config.nomeLoja)}</div><div class="bb-badge-sub">Barber & Executive Grooming</div></div>`;
    }

    function renderWho(){
      whoBox.innerHTML = `
        <select id="bb-select">
          <option value="">Área do Cliente</option>
          <option value="__gestor" ${roleMode==='gestor'?'selected':''}>🔒 Painel do Gestor</option>
        </select>
      `;
      document.getElementById('bb-select').onchange = (e) => {
        if(e.target.value === '__gestor'){
          const pin = prompt('Digite a senha do Gestor:');
          if(pin === '9871'){ roleMode = 'gestor'; } 
          else { alert('Senha incorreta!'); return; }
        } else {
          roleMode = null;
        }
        localStorage.setItem('barb-role', roleMode || '');
        boot();
      };
    }

    function renderTabs(){
      const tabs = [
        {k:'agendar', label:'Agendar Corte'}, 
        {k:'cortes', label:'Buscar Cortes & Preços'}
      ];
      if(isAdmin()) {
        tabs.push({k:'agendamentos', label:'Agendamentos'}, {k:'fechamento', label:'Fechamento & Comissões'}, {k:'gerenciar', label:'Gerenciar Barbeiros & Servicos'});
      }
      tabsBox.innerHTML = tabs.map(t => `<div class="bb-tab ${activeTab===t.k?'active':''}" onclick="window.setTab('${t.k}')">${t.label}</div>`).join('');
    }

    window.setTab = (tab) => { activeTab = tab; renderTabs(); renderBody(); };

    async function renderBody(){
      await carregarAgendamentosSupabase();
      if(activeTab === 'cortes') renderCortes();
      else if(activeTab === 'agendamentos' && isAdmin()) renderAgendamentos();
      else if(activeTab === 'fechamento' && isAdmin()) renderFechamento();
      else if(activeTab === 'gerenciar' && isAdmin()) renderGerenciar();
      else renderAgendar();
    }

    function renderAgendar(){
      const ativos = barbeiros.filter(b => b.ativo);

      body.innerHTML = `
        <div class="bb-hero">
          <h1>Agende seu Horário</h1>
          <p style="color:var(--texto-mutado);">Escolha o serviço, o profissional e garanta seu horário em segundos.</p>
        </div>

        <div class="bb-panel">
          <h2>Novo Agendamento</h2>
          <form id="form-agendar">
            <div class="bb-form-row">
              <div class="bb-field"><label>Seu Nome</label><input type="text" id="ag-nome" placeholder="Digite seu nome completo" required></div>
              <div class="bb-field"><label>WhatsApp</label><input type="tel" id="ag-fone" placeholder="(61) 99999-9999" required></div>
              <div class="bb-field"><label>Data</label><input type="date" id="ag-data" value="${selectedDate}" required></div>
            </div>

            <div class="bb-form-row">
              <div class="bb-field">
                <label>Barbeiro Responsável</label>
                <select id="ag-barbeiro" required>
                  <option value="">Selecione um barbeiro...</option>
                  ${ativos.map(b => `<option value="${esc(b.nome)}">${esc(b.nome)}</option>`).join('')}
                </select>
              </div>
              <div class="bb-field">
                <label>Horário</label>
                <select id="ag-hora" required>
                  ${gerarSlots().map(h => `<option value="${h}">${h}</option>`).join('')}
                </select>
              </div>
              <div class="bb-field">
                <label>Selecione o Corte</label>
                <select id="ag-corte" required>
                  ${cortes.map(c => `<option value="${esc(c.nome)}">${esc(c.nome)} - R$ ${c.preco}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="bb-field" style="margin-bottom:20px;">
              <label>Serviço Adicional</label>
              <select id="ag-adicional">
                <option value="Somente a opção não mesmo">Não (Apenas o Corte)</option>
                <option value="Barba Completa (+R$30)">Barba Completa (+R$30)</option>
                <option value="Sobrancelha (+R$15)">Sobrancelha (+R$15)</option>
                <option value="Freestyle / Desenho (+R$20)">Freestyle / Desenho (+R$20)</option>
              </select>
            </div>

            <button type="submit" class="bb-btn primary" id="btn-submit">Confirmar Agendamento</button>
          </form>
        </div>
        <div id="ag-confirmacao"></div>
      `;

      document.getElementById('form-agendar').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = "Salvando...";

        const bNome = document.getElementById('ag-barbeiro').value;
        const hora = document.getElementById('ag-hora').value;
        const data = document.getElementById('ag-data').value;
        const cliente = document.getElementById('ag-nome').value;
        const fone = document.getElementById('ag-fone').value;
        const corteNome = document.getElementById('ag-corte').value;
        const adicional = document.getElementById('ag-adicional').value;

        const barbeiroObj = barbeiros.find(b => b.nome.toUpperCase() === bNome.toUpperCase()) || barbeiros[0];
        const corteObj = cortes.find(c => c.nome.toUpperCase() === corteNome.toUpperCase()) || cortes[0];

        const novoItem = {
          cliente: cliente,
          telefone: fone,
          barbeiro: barbeiroObj.nome,
          data: data,
          hora: hora,
          corte: corteNome,
          valor_total: corteObj.preco,
          porcentagem_comissao: 50
        };

        // Grava no Supabase diretamente
        const { error } = await sbClient.from('se_agendamentos').insert([novoItem]);

        if (error) {
          alert("Erro ao gravar no banco: " + error.message);
          btn.disabled = false;
          btn.innerText = "Confirmar Agendamento";
          return;
        }

        const dataFormatada = data.split('-').reverse().join('/');
        const textoMsg = `Olá, ${barbeiroObj.nome}.\n\nMe chamo "${cliente}"\nAgendei o corte: ${corteNome}\nPra o dia e hora tal: ${dataFormatada} às ${hora}\nserviço adicional: ${adicional}`;
        
        const urlWspBarbeiro = `https://wa.me/${barbeiroObj.telefone_whatsapp}?text=${encodeURIComponent(textoMsg)}`;
        const urlWspGestor = `https://wa.me/${config.whatsappAdmin}?text=${encodeURIComponent("Notificação de Agendamento:\n" + textoMsg)}`;

        document.getElementById('ag-confirmacao').innerHTML = `
          <div class="bb-panel" style="border-left: 4px solid var(--dourado);">
            <h3 style="color:var(--dourado); margin-bottom:10px;">✔ Agendamento Salvo com Sucesso!</h3>
            <p style="margin-bottom:15px; font-size:14px;">Envie o comprovante diretamente pelo WhatsApp:</p>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
              <a href="${urlWspBarbeiro}" target="_blank" class="bb-btn wsp">📲 Notificar Barbeiro (${barbeiroObj.nome})</a>
              <a href="${urlWspGestor}" target="_blank" class="bb-btn wsp" style="background:#333;">👑 Notificar Gestor (Danilo)</a>
            </div>
          </div>
        `;
        btn.innerText = "Confirmado!";
      };
    }

    function renderCortes(){
      body.innerHTML = `
        <div class="bb-panel">
          <h2>Buscar Cortes & Tabela de Preços (2026)</h2>
          <div style="margin-bottom:20px;">
            <input type="text" id="busca-corte" placeholder="🔍 Digite o nome do corte para buscar..." style="width:100%; background:var(--bg-input); color:#fff; border:1px solid var(--borda); padding:12px; border-radius:8px;">
          </div>
          <div class="bb-cortes-grid" id="lista-cortes">
            ${cortes.map(c => `
              <div class="bb-corte-card">
                <h3>${esc(c.nome)}</h3>
                <p>${esc(c.desc)}</p>
                <div class="preco">R$ ${c.preco.toFixed(2)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.getElementById('busca-corte').oninput = (e) => {
        const termo = e.target.value.toLowerCase();
        const filtrados = cortes.filter(c => c.nome.toLowerCase().includes(termo) || c.desc.toLowerCase().includes(termo));
        document.getElementById('lista-cortes').innerHTML = filtrados.map(c => `
          <div class="bb-corte-card">
            <h3>${esc(c.nome)}</h3>
            <p>${esc(c.desc)}</p>
            <div class="preco">R$ ${c.preco.toFixed(2)}</div>
          </div>
        `).join('');
      };
    }

    function renderAgendamentos(){
      body.innerHTML = `
        <div class="bb-panel">
          <h2>Agendamentos Salvos no Banco (Supabase)</h2>
          <div class="bb-grid-wrap">
            <table class="bb-grid">
              <thead>
                <tr><th>Data/Hora</th><th>Cliente</th><th>Telefone</th><th>Barbeiro</th><th>Corte</th><th>Valor</th></tr>
              </thead>
              <tbody>
                ${agendamentos.map(a => `
                  <tr>
                    <td>${a.data} ${a.hora}</td>
                    <td>${esc(a.cliente)}</td>
                    <td>${esc(a.telefone)}</td>
                    <td>${esc(a.barbeiro)}</td>
                    <td>${esc(a.corte)}</td>
                    <td>R$ ${(Number(a.valor_total) || 40).toFixed(2)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderFechamento(){
      body.innerHTML = `
        <div class="bb-panel">
          <h2>📊 Fechamento Financeiro & Comissões (50%)</h2>
          <div class="bb-form-row">
            <div class="bb-field"><label>Data Início</label><input type="date" id="fc-inicio" value="${selectedDate}"></div>
            <div class="bb-field"><label>Data Fim</label><input type="date" id="fc-fim" value="${selectedDate}"></div>
            <button class="bb-btn primary" id="btn-fc" style="margin-top:18px;">Filtrar Período</button>
          </div>
          <div id="res-fechamento" style="margin-top:20px;"></div>
        </div>
      `;

      const calc = () => {
        const i = document.getElementById('fc-inicio').value;
        const f = document.getElementById('fc-fim').value;
        const ags = agendamentos.filter(a => a.data >= i && a.data <= f);

        const rel = {};
        barbeiros.forEach(b => { rel[b.nome] = { atend:0, bruto:0, comissao:0, liquido:0 }; });

        ags.forEach(a => {
          if(!rel[a.barbeiro]) rel[a.barbeiro] = { atend:0, bruto:0, comissao:0, liquido:0 };
          const v = Number(a.valor_total) || 40;
          rel[a.barbeiro].atend += 1;
          rel[a.barbeiro].bruto += v;
          rel[a.barbeiro].comissao += (v * 0.5);
          rel[a.barbeiro].liquido += (v * 0.5);
        });

        document.getElementById('res-fechamento').innerHTML = `
          <div class="bb-grid-wrap">
            <table class="bb-grid">
              <thead>
                <tr><th>Barbeiro</th><th>Atendimentos</th><th>Bruto</th><th>Comissão Barbeiro (50%)</th><th>Líquido Barbearia (50%)</th></tr>
              </thead>
              <tbody>
                ${Object.keys(rel).map(k => `
                  <tr>
                    <td><b>${esc(k)}</b></td>
                    <td>${rel[k].atend} clientes</td>
                    <td>R$ ${rel[k].bruto.toFixed(2)}</td>
                    <td style="color:var(--dourado);">R$ ${rel[k].comissao.toFixed(2)}</td>
                    <td style="color:#25D366;">R$ ${rel[k].liquido.toFixed(2)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      };

      document.getElementById('btn-fc').onclick = calc;
      calc();
    }

    function renderGerenciar(){
      body.innerHTML = `
        <div class="bb-panel">
          <h2>Adicionar Barbeiro (Exclusivo Gestor)</h2>
          <div class="bb-form-row">
            <div class="bb-field"><label>Nome</label><input type="text" id="novo-b-nome" placeholder="Ex: LUCAS"></div>
            <div class="bb-field"><label>WhatsApp</label><input type="text" id="novo-b-wsp" placeholder="5561999999999"></div>
            <button class="bb-btn primary" id="btn-add-b" style="margin-top:18px;">Cadastrar Barbeiro</button>
          </div>
        </div>

        <div class="bb-panel">
          <h2>Adicionar / Alterar Preço dos Cortes</h2>
          <div class="bb-form-row">
            <div class="bb-field"><label>Nome do Corte</label><input type="text" id="novo-c-nome" placeholder="Ex: Freestyle"></div>
            <div class="bb-field"><label>Preço (R$)</label><input type="number" id="novo-c-preco" placeholder="40"></div>
            <button class="bb-btn primary" id="btn-add-c" style="margin-top:18px;">Salvar Corte/Preço</button>
          </div>
        </div>
      `;

      document.getElementById('btn-add-b').onclick = () => {
        const n = document.getElementById('novo-b-nome').value.toUpperCase();
        const w = document.getElementById('novo-b-wsp').value;
        if(n && w){
          barbeiros.push({ id: Date.now(), nome: n, telefone_whatsapp: w, porcentagem_comissao: 50, ativo: true });
          alert(`Barbeiro ${n} cadastrado!`);
          renderWho();
        }
      };

      document.getElementById('btn-add-c').onclick = () => {
        const n = document.getElementById('novo-c-nome').value;
        const p = Number(document.getElementById('novo-c-preco').value);
        if(n && p){
          const index = cortes.findIndex(c => c.nome.toLowerCase() === n.toLowerCase());
          if(index >= 0) cortes[index].preco = p;
          else cortes.push({ id: Date.now(), nome: n, desc: 'Corte personalizado', preco: p });
          alert(`Corte/Preço atualizado!`);
        }
      };
    }

    function boot(){
      renderLogo();
      renderWho();
      renderTabs();
      renderBody();
    }

    boot();
  })();
  </script>
</body>
</html>
